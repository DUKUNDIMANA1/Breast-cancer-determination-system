# =============================================================
# BreastCare AI — Nginx Configuration
# Copy to: /etc/nginx/sites-available/breastcare
# Then: ln -s /etc/nginx/sites-available/breastcare /etc/nginx/sites-enabled/
# =============================================================

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;   # e.g. breastcare.moh.gov.rw or 192.168.1.100

    # Redirect HTTP → HTTPS (uncomment after SSL setup)
    # return 301 https://$host$request_uri;

    # ── Static files served directly by Nginx (fast) ──
    location /static/ {
        alias /var/www/breastcare/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── Proxy to Gunicorn ──────────────────────────────
    location / {
        proxy_pass http://unix:/var/www/breastcare/breastcare.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Upload size limit (for histopathology images)
        client_max_body_size 20M;
    }

    # ── Security headers ───────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

